<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">

  <title>CSE Timetable</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #f1f5f9; padding: 15px; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 450px; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow: hidden; border: 1px solid #e2e8f0; }
    .header { background: linear-gradient(135deg, #1e40af, #3b82f6); color: white; padding: 18px; text-align: center; }
    .header h2 { font-size: 20px; margin-bottom: 4px; }
    .header p { font-size: 12px; opacity: 0.9; }
    .controls { padding: 15px; background: #f8fafc; border-bottom: 1px solid #f1f5f9; }
    .label { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 6px; display: block; }
    .gt { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #e2e8f0; padding: 4px; border-radius: 10px; margin-bottom: 14px; }
    .gt button { border: none; padding: 8px; border-radius: 8px; font-weight: 700; font-size: 13px; color: #475569; background: transparent; cursor: pointer; transition: 0.2s; }
    .gt button.active { background: white; color: #1e40af; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
    .days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .days button { border: 1px solid #cbd5e1; background: white; color: #475569; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .days button.active { background: #1e40af; color: white; border-color: #1e40af; }
    .list { padding: 15px; display: flex; flex-direction: column; gap: 12px; }
    .card { border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px; border-left: 4px solid #3b82f6; background: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .card.lab { border-left-color: #10b981; background: #f0fdf4; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .time { font-size: 12px; font-weight: 700; color: #1e40af; background: #dbeafe; padding: 3px 8px; border-radius: 6px; }
    .card.lab .time { color: #047857; background: #d1fae5; }
    .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: #f1f5f9; color: #475569; }
    .title { font-size: 15px; font-weight: 700; color: #1e293b; margin-bottom: 6px; line-height: 1.3; }
    .meta { font-size: 12px; color: #64748b; display: flex; flex-direction: column; gap: 3px; }
  </style>
</head>
<body>

<div class="app">
  <div class="header">
    <h2>CSE Department</h2>
    <p>Class Timetable & Lab Schedule</p>
  </div>

  <div class="controls">
    <span class="label">Select Group</span>
    <div class="gt">
      <button class="active" onclick="setGroup('G1', this)">Group G1</button>
      <button onclick="setGroup('G2', this)">Group G2</button>
    </div>

    <span class="label">Select Day</span>
    <div class="days" id="dayBtns">
      <button class="active" onclick="setDay('Monday', this)">Mon</button>
      <button onclick="setDay('Tuesday', this)">Tue</button>
      <button onclick="setDay('Wednesday', this)">Wed</button>
      <button onclick="setDay('Thursday', this)">Thu</button>
      <button onclick="setDay('Friday', this)">Fri</button>
      <button onclick="setDay('Saturday', this)">Sat</button>
    </div>
  </div>

  <div class="list" id="scheduleList"></div>
</div>
