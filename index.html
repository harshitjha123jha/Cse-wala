<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSE Timetable</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #f1f5f9; padding: 12px; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 450px; background: #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    .top-bar { background: #1e40af; color: #fff; padding: 16px; text-align: center; }
    .top-bar h2 { font-size: 19px; }
    .top-bar p { font-size: 12px; opacity: 0.85; margin-top: 3px; }
    .menu { padding: 14px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
    .lbl { font-size: 11px; font-weight: bold; color: #64748b; margin-bottom: 5px; display: block; }
    .grp-box { display: flex; gap: 6px; background: #e2e8f0; padding: 4px; border-radius: 10px; margin-bottom: 12px; }
    .grp-box button { flex: 1; border: none; padding: 8px; border-radius: 8px; font-weight: bold; background: transparent; color: #475569; cursor: pointer; }
    .grp-box button.on { background: #fff; color: #1e40af; }
    .day-box { display: flex; gap: 5px; overflow-x: auto; }
    .day-box button { border: 1px solid #cbd5e1; background: #fff; color: #475569; padding: 6px 11px; border-radius: 18px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .day-box button.on { background: #1e40af; color: #fff; border-color: #1e40af; }
    .cards { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .item { border: 1px solid #e2e8f0; border-left: 4px solid #2563eb; border-radius: 12px; padding: 12px; background: #fff; }
    .item.lab { border-left-color: #10b981; background: #f0fdf4; }
    .row { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; margin-bottom: 6px; }
    .tm { color: #1e40af; background: #dbeafe; padding: 2px 7px; border-radius: 5px; }
    .lab .tm { color: #047857; background: #d1fae5; }
    .tag { color: #475569; background: #f1f5f9; padding: 2px 7px; border-radius: 5px; }
    .sub { font-size: 14px; font-weight: bold; color: #1e293b; margin-bottom: 5px; }
    .info { font-size: 12px; color: #475569; line-height: 1.5; }
  </style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <h2>CSE Department</h2>
    <p>Class & Lab Timetable</p>
  </div>
  <div class="menu">
    <span class="lbl">SELECT GROUP</span>
    <div class="grp-box" id="gBtns">
      <button class="on" onclick="chgG('G1',0)">Group G1</button>
      <button onclick="chgG('G2',1)">Group G2</button>
    </div>
    <span class="lbl">SELECT DAY</span>
    <div class="day-box" id="dBtns">
      <button class="on" onclick="chgD('Mon',0)">Mon</button>
      <button onclick="chgD('Tue',1)">Tue</button>
      <button onclick="chgD('Wed',2)">Wed</button>
      <button onclick="chgD('Thu',3)">Thu</button>
      <button onclick="chgD('Fri',4)">Fri</button>
      <button onclick="chgD('Sat',5)">Sat</button>
    </div>
  </div>
  <div class="cards" id="out"></div>
</div>
<script>
  var list = [
    ["Mon","10-11","All","100108","Computer Fundamentals & Emerging Tech","Lecture","Room 1","Mrs. Priti Kumari",""],
    ["Mon","11-12","All","100104","Engineering Physics","Lecture","Room 1","Dr. Mukesh Kumar Pandey",""],
    ["Mon","12-01","All","100105","Introduction to AI","Lecture","Room 1","Mr. Hemant Razz",""],
    ["Mon","02-03","All","100111","Basics of Electrical & Electronics","Lecture","Room 1","Mr. Sanat",""],
    ["Mon","03-04","All","100102","Engineering Mathematics - I","Lecture","Room 1","Dr. Matiram Das",""],
    ["Mon","04-05","All","100110","Essence of Indian Constitution","Lecture","Room 1","Mr. Abhishek Kumar",""],
    ["Tue","11-12","All","100109","Universal Human Values","Lecture","Room 1","Mr. Sumit Sardesai",""],
    ["Tue","12-01","All","100104","Engineering Physics","Lecture","Room 1","Dr. Mukesh Kumar Pandey",""],
    ["Tue","02-03","All","100102","Engineering Mathematics - I","Lecture","Room 1","Dr. Matiram Das",""],
    ["Tue","03-04","All","100105","Introduction to AI","Lecture","Room 1","Mr. Hemant Razz",""],
    ["Tue","04-05","All","100110","Essence of Indian Constitution","Lecture","Room 1","Mr. Abhishek Kumar",""],
    ["Wed","11-12","All","100104","Engineering Physics","Lecture","Room 1","Dr. Mukesh Kumar Pandey",""],
    ["Wed","12-01","All","100111","Basics of Electrical & Electronics","Lecture","Room 1","Mr. Sanat",""],
    ["Wed","02-04","G1","100104P","Engineering Physics Lab","Lab","Physics Lab","Dr. Mukesh Kumar Pandey","Mr. Santu Kumar"],
    ["Wed","04-05","G2","100112P","Programming for Problem Solving Lab","Lab","Computer Centre","Mr. Arun Kumar","Mr. Ravi Kumar"],
    ["Thu","11-12","All","100111","Basics of Electrical & Electronics","Lecture","Room 2","Mr. Sanat",""],
    ["Thu","12-01","All","100108","Computer Fundamentals & Emerging Tech","Lecture","Room 2","Mrs. Priti Kumari",""],
    ["Thu","02-03","G2","100112P","Programming for Problem Solving Lab","Lab","Computer Centre","Mr. Arun Kumar",""],
    ["Thu","04-05","All","100102","Engineering Mathematics - I","Lecture","Room 2","Dr. Matiram Das",""],
    ["Fri","10-12","G1","100111P","Basics of Electrical & Electronics Lab","Lab","Electrical Lab","Mr. Sanat","Mr. Nikhil Ranjan"],
    ["Fri","12-03","G1","100112P","Programming for Problem Solving Lab","Lab","Computer Centre","Mr. Arun Kumar","Mr. Ravi Kumar"],
    ["Fri","03-04","All","100109","Universal Human Values","Lecture","Room 1","Mr. Sumit Sardesai",""],
    ["Fri","04-05","All","100108","Computer Fundamentals & Emerging Tech","Lecture","Room 1","Mrs. Priti Kumari",""],
    ["Sat","10-11","All","100110","Essence of Indian Constitution","Lecture","Room 1","Mr. Abhishek Kumar",""],
    ["Sat","11-01","G2","100104P","Engineering Physics Lab","Lab","Physics Lab","Dr. Mukesh Kumar Pandey","Mr. Santu Kumar"],
    ["Sat","02-03","All","100105","Introduction to AI","Lecture","Room 1","Mr. Hemant Razz",""],
    ["Sat","03-05","G2","100111P","Basics of Electrical & Electronics Lab","Lab","Electrical Lab","Mr. Sanat","Mr. Nikhil Ranjan"]
  ];
  var g = "G1", d = "Mon";
  function chgG(val, idx) {
    g = val;
    var b = document.getElementById("gBtns").children;
    for (var i = 0; i < b.length; i++) b[i].className = (i == idx) ? "on" : "";
    load();
  }
  function chgD(val, idx) {
    d = val;
    var b = document.getElementById("dBtns").children;
    for (var i = 0; i < b.length; i++) b[i].className = (i == idx) ? "on" : "";
    load();
  }
  function load() {
    var h = "";
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      if (r[0] == d && (r[2] == "All" || r[2] == g)) {
        h += '<div class="item ' + (r[5] == "Lab" ? "lab" : "") + '">' +
             '<div class="row"><span class="tm">🕒 ' + r[1] + '</span><span class="tag">' + r[5] + ' • ' + r[3] + '</span></div>' +
             '<div class="sub">' + r[4] + '</div>' +
             '<div class="info">📍 <b>Venue:</b> ' + r[6] + ' (' + r[2] + ')<br>👨‍🏫 <b>Faculty:</b> ' + r[7] +
             (r[8] ? '<br>🧑‍💻 <b>TA:</b> ' + r[8] : '') + '</div></div>';
      }
    }
    document.getElementById("out").innerHTML = h;
  }
  load();
</script>
</body>
</html>
